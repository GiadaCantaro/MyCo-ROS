sensors:
  - my_camera_sensor

my_camera_sensor:
  filtered_cloud_topic: filtered_cloud
  max_range: 2.5
  max_update_rate: 10.0
  padding_offset: 0.05
  padding_scale: 1.0
  point_cloud_topic: intel_rsd455/depth_pcl
  point_subsample: 1
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
